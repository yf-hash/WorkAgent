# SA Role — 售前解决方案工程师角色声明式清单（v1.0）
#
# 本文件由 agents/sa.md 在会话开始时加载，作为路由决策的唯一数据源。
# 服务对象：售前工程师 / 解决方案工程师（Solution Architect / Sales Engineer）
#
# ---
# 消费者：.claude/harness/role/router.md（通用交互 SOP）
# 参考格式：.claude/harness/role/README.md

role:
  name: 售前解决方案工程师
  entry:
    slash: /sa
    at: "@sa"
  scope: >
    端到端售前项目流水线：从销售转述的一句话客户信息 / RFP 招标文件 →
    客户调研澄清 → 方案拆解 → 总体方案架构 → POC / 实施 / RFP 应答 →
    报价与宣讲底稿 → 版本归档。
  positioning: >
    你是售前工程师的"总入口"，专注 7 模块端到端流水线的编排与调度。
    大多数情况下应推荐 /sa-pipeline 一键调度，也可按需分步执行单模块命令。
    区别于 /pm（服务产品经理内部 PRD 场景），本 role 服务对外客户项目场景。

# ============================================================
# 能力域 → 命令映射
# 7 模块流水线 + 1 编排器 = 10 个命令
# ============================================================
capabilities:

  presales-pipeline:
    description: 端到端售前项目处理流水线（M1 → M7）
    commands:
      - /sa-intake          # 【M1】多源客户输入网关（销售转述/RFP/访谈/PPT/Excel → 结构化）
      - /sa-clarify         # 【M2】客户调研澄清（痛点报告）
      - /sa-solution-map    # 【M3】方案拆解（业务-能力映射 + 竞争 + 风险）
      - /sa-architect       # 【M4】总体方案架构（业务/技术架构 + Mermaid）+ 方案校验
      - /sa-poc             # 【M5.1】POC 测试方案
      - /sa-impl            # 【M5.2】实施方案
      - /sa-rfp             # 【M5.3】RFP 应答 + 技术偏离表
      - /sa-quote           # 【M6】配置估算 + 宣讲材料底稿
      - /sa-archive         # 【M7】版本快照归档 + 局部重跑
      - /sa-pipeline        # 端到端 7 模块流水线一键编排

# ============================================================
# 典型工作流
# ============================================================
workflows:

  # ------------------------------------------------------------
  # 【核心】端到端售前项目流水线（7 模块 + 归档）
  # 销售一句话 / RFP → 调研 → 方案 → POC/实施/应答 → 报价 → 归档
  # ------------------------------------------------------------
  end-to-end-presales:
    trigger:
      - "端到端售前"
      - "全流程方案"
      - "从客户到方案"
      - "投标全流程"
      - "完整售前包"
      - "从需求到应答"
    description: 端到端 7 模块售前流水线（客户输入 → 归档）
    output-dir: ./output/sa-pipeline/{client}-{project}-{yyyymmdd}/
    stages:
      - id: M1
        command: /sa-intake
        args: "{raw_input}"
        purpose: 【模块1】多源输入解析，提取客户元信息，标记需求模糊等级
        produces: 00-intake.json
        gate:
          type: human-review
          prompt: "《客户项目元数据》已生成，请确认关键字段（行业/规模/预算/时间）"
      - id: M2
        command: /sa-clarify
        args: "00-intake.json"
        purpose: 【模块2】信息缺口识别 + 调研问题 + 痛点收敛
        produces: 01-clarify-report.md
        gate:
          type: human-review
          prompt: "《客户调研与痛点分析报告》已生成，请确认或驳回（可回到重新调研）"
      - id: M3
        command: /sa-solution-map
        args: "01-clarify-report.md"
        purpose: 【模块3】业务-能力映射 + 竞争分析 + 风险识别
        produces: 02-solution-map.md
        gate:
          type: human-review
          prompt: "《方案定位》已生成，可人工调整能力匹配结果、标记定制范围"
      - id: M4
        command: /sa-architect
        args: "02-solution-map.md"
        purpose: 【模块4】总体方案 + 架构（业务/技术 + Mermaid）+ 三项校验
        produces:
          - 03-overall-solution.md
          - 03-architecture.mmd
          - 03-solution-validate.md
        gate:
          type: human-review
          prompt: "《总体方案》已生成，修改确认后向下游流转"
      - id: M5
        command: /sa-poc-impl-rfp
        args: "03-overall-solution.md"
        purpose: 【模块5】三个专项方案并行生成（POC / 实施 / RFP 应答）
        produces:
          - 04-poc-plan.md
          - 04-impl-plan.md
          - 04-rfp-response.md
          - 04-deviation-table.md
        gate:
          type: human-review
          prompt: "《专项方案》全部生成，请审阅"
      - id: M6
        command: /sa-quote
        args: "03-overall-solution.md 04-poc-plan.md"
        purpose: 【模块6】配置估算清单 + 宣讲材料底稿（PPT 大纲 + 文案 + 话术）
        produces:
          - 05-config-estimate.md
          - 05-presentation-draft.md
        gate:
          type: human-review
          prompt: "《报价估算底稿》与《宣讲材料底稿》已生成，估算需商务人工确认"
      - id: M7
        command: /sa-archive
        args: "{output-dir}"
        purpose: 【归档】版本快照 + README + CHANGELOG + 导出 Markdown/Word
        produces:
          - README.md
          - CHANGELOG.md
          - VERSION
        gate: none

# ============================================================
# 单点直达（识别到明确单一 command 时，跳过计划流程）
# ============================================================
single-shot:
  - trigger: ["客户输入接入", "RFP 解析", "招标文件解析", "销售转述"]
    command: /sa-intake
  - trigger: ["客户调研", "痛点报告", "调研问题", "客户画像"]
    command: /sa-clarify
  - trigger: ["方案拆解", "能力映射", "竞品对标", "能力矩阵"]
    command: /sa-solution-map
  - trigger: ["总体方案", "架构方案", "总体架构", "架构图"]
    command: /sa-architect
  - trigger: ["POC 方案", "POC 测试", "POC 计划"]
    command: /sa-poc
  - trigger: ["实施方案", "落地方案", "上线切换"]
    command: /sa-impl
  - trigger: ["RFP 应答", "招标应答", "偏离表", "技术偏离表"]
    command: /sa-rfp
  - trigger: ["报价估算", "配置清单", "资源估算", "PPT 大纲", "宣讲材料"]
    command: /sa-quote
  - trigger: ["售前归档", "方案归档", "版本快照"]
    command: /sa-archive
  - trigger: ["端到端售前", "全流程方案", "完整售前包"]
    command: /sa-pipeline

# ============================================================
# 默认参数（未指定时使用）
# ============================================================
defaults:
  industry: generic         # generic / govtech / manufacturing / finance / saas
  deployment: private       # private / public / hybrid
  compliance: []            # 等保 / 国产化 / GDPR / SOC2 ... 空表示无
  output-dir: ./output/sa-pipeline
  language: zh-CN
